name: docs

# Builds and publishes the mkdocs teaching site to GitHub Pages.
# Requires GitHub Pages to be enabled for the repo with source = gh-pages branch
# (Settings → Pages → Build and deployment → Deploy from a branch → gh-pages).

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict
      - run: mkdocs gh-deploy --force
